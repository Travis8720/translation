<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HUFS 통역시스템</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div class="s-app">
    <header class="s-head">
      <img class="logo" src="logo.png" alt="HUFS">
      <h1 id="headTitle">Language / 언어</h1>
      <button id="fontBtn" class="btn plain icon-only" data-icon="text" aria-label="Text size" aria-pressed="false"></button>
      <button id="saveBtn" class="btn plain" data-icon="download" aria-label="Save" hidden><span class="lbl">Save</span></button>
      <button id="changeBtn" class="btn plain" data-icon="globe" aria-label="Change language" hidden><span class="lbl">Change language</span></button>
    </header>

    <section id="pickView" class="pick" hidden>
      <p class="eyebrow">INTERPRETATION SYSTEM</p>
      <h2>Choose your language</h2>
      <p class="pick-sub">言語を選んでください / 请选择语言 / 請選擇語言</p>
      <div class="langs" id="langs"></div>
      <p class="error" id="pickError"></p>
    </section>

    <section id="chatView" class="chat" hidden>
      <p class="ended-bar" id="endedBar" hidden></p>
      <div class="log" id="log" aria-live="polite">
      </div>
      <p class="error" id="error"></p>
      <p class="mic-hint" id="micHint" hidden></p>
      <div class="composer">
        <button class="icon-btn" id="mic" data-icon="mic" data-size="22" aria-label="Speak" aria-pressed="false"></button>
        <textarea id="input" rows="1" dir="auto" spellcheck="true" placeholder="Type your message"></textarea>
        <button class="btn" id="send">Send</button>
      </div>
    </section>

    <p id="notice" class="notice" hidden></p>
  </div>

  <script type="module" src="student.js?v=12"></script>
</body>
</html>
